<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sold-out product, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.4A4 4 0 0119 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 21h4"/></symbol>
</defs></svg>

<div style="position:absolute;left:0;right:0;top:0;height:330px;background:#2A2A2A;overflow:hidden">
<svg viewBox="0 0 100 62" style="position:absolute;left:40px;top:56px;width:310px;height:auto;opacity:.4" role="img" aria-label="Sneaker, sold out"><path d="M6 48c0-6 6-8 12-10l16-17c4-4 10-2 14 2l8 8c8 2 28 4 36 10 4 3 4 8 0 10H10z" fill="#F2F0EC"/><path d="M30 43c14-6 34-6 52 0" fill="none" stroke="#A19C94" stroke-width="3" stroke-linecap="round"/><path d="M6 48h88v7c0 2-2 3-4 3H10c-2 0-4-1-4-3z" fill="#A19C94"/><path d="M36 22l7 8M44 24l7 8" stroke="#A19C94" stroke-width="2.2" stroke-linecap="round"/></svg>
<span style="position:absolute;left:50%;top:128px;transform:translateX(-50%);height:44px;padding:0 24px;border-radius:22px;background:#F2F0EC;color:#131212;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:.12em;text-transform:uppercase;display:grid;place-items:center">Sold out</span>
</div>
<span style="position:absolute;left:12px;top:12px;width:44px;height:44px;border-radius:50%;background:#131212;color:#F2F0EC;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-back"/></svg></span>

<div style="position:absolute;left:0;right:0;top:300px;bottom:0;background:#131212;border-radius:24px 24px 0 0;padding:20px 16px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;overflow:hidden">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#A19C94">Off White · Men's sneakers</span>
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:#A19C94">Sports Sneakers Off White & Red</h1>
</div>
<div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:#A19C94">₹9,999</span></div>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A19C94">Sizes (UK)</span>
<div style="display:flex;gap:8px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="6">
<span style="width:50px;height:44px;border:1px dashed #302E2E;border-radius:10px;display:grid;place-items:center;color:#A19C94;font-size:15px;font-weight:600;text-decoration:line-through;opacity:.6">{{s}}</span>
</sc-for>
</div>
</div>

<div style="display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:12px;background:#1F1E1E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9B79A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px" aria-hidden="true"><use href="#i-bell"/></svg>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14.5px;font-weight:700">This shoe is sold out</span><span style="font-size:13px;line-height:1.45;color:#A19C94">We'll notify you if any size comes back in stock.</span></div>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#131212;border-top:1px solid #302E2E;display:flex;gap:10px;padding:12px 16px 20px;box-sizing:border-box">
<span style="flex:none;width:52px;height:52px;border:1.5px solid #F2F0EC;border-radius:12px;display:grid;place-items:center" role="img" aria-label="Save to wishlist"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"/></svg></span>
<div style="flex:1;height:52px;border-radius:12px;background:#C9B79A;color:#131212;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-bell"/></svg>Notify me</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { sizes: ['6', '7', '8', '9', '10', '11'] };
  }
}
</script>
</body>
</html>
