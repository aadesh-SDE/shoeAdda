<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Help, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:16px;padding-top:12px">

<div style="display:flex;align-items:center;height:52px;padding:0 4px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<span style="width:44px;height:44px;display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-back"/></svg></span>
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.015em;text-transform:uppercase">Help and policies</h1>
</div>

<div style="display:flex;flex-direction:column;gap:12px;margin:0 16px;padding:16px;border:1.5px solid #C9B79A;border-radius:16px">
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase">Return and exchange</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg)" aria-hidden="true"><use href="#i-chev"/></svg></div>
<sc-for list="{{points}}" as="p" hint-placeholder-count="4">
<div style="display:flex;gap:10px;align-items:flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B79A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px" aria-hidden="true"><use href="#i-check"/></svg><span style="font-size:14px;line-height:1.5">{{p}}</span></div>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;padding:0 16px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid #302E2E"><span style="flex:1;font-size:15px;font-weight:600">{{r}}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A19C94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chev"/></svg></div>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px 0;font-size:12.5px;color:#A19C94">
<span style="font-weight:700;color:#F2F0EC">ShoeAdda</span>
<span>Version 1.0 · Walk your way</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      points: [
        'Return or exchange within 30 days of delivery.',
        'Size exchange is free. Pick a new size in the app.',
        'Shoes must be unworn and in the original box.',
        'Refunds go back to your original payment method in 5 to 7 days.'
      ],
      rows: ['Delivery information', 'How to measure your foot', 'Payments and coupons', 'Frequently asked questions', 'Terms of Use', 'Privacy Policy']
    };
  }
}
</script>
</body>
</html>
