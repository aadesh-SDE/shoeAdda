<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter sheet, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">

<div style="padding:24px 16px;display:flex;flex-direction:column;gap:16px" aria-hidden="true">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.015em">Men's sneakers</span>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="height:150px;border-radius:16px;background:#2B3A41"></div><div style="height:150px;border-radius:16px;background:#2A2A2A"></div></div>
</div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,.62)"></div>

<div role="dialog" aria-label="Filters" style="position:absolute;left:0;right:0;top:60px;bottom:0;background:#1A1918;border-radius:24px 24px 0 0;display:flex;flex-direction:column">
<div style="width:40px;height:4px;border-radius:2px;background:#302E2E;margin:10px auto 4px"></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 8px 0 16px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.015em;text-transform:uppercase">Filters</h2>
<span style="height:44px;padding:0 12px;display:grid;place-items:center;color:#C9B79A;font-size:14px;font-weight:600">Reset</span>
</div>

<div style="flex:1;overflow:hidden;padding:8px 16px 0;display:flex;flex-direction:column;gap:16px">

<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A19C94">Size</span>
<div style="display:flex;background:#262524;border-radius:10px;padding:3px;gap:2px"><span style="height:28px;padding:0 14px;border-radius:8px;background:#131212;font-size:12.5px;font-weight:700;display:grid;place-items:center">UK</span><span style="height:28px;padding:0 14px;color:#A19C94;font-size:12.5px;font-weight:600;display:grid;place-items:center">US</span><span style="height:28px;padding:0 14px;color:#A19C94;font-size:12.5px;font-weight:600;display:grid;place-items:center">EU</span></div></div>
<div style="display:flex;gap:8px">
<span style="width:48px;height:36px;border:1px solid #302E2E;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:600">6</span>
<span style="width:48px;height:36px;border:1px solid #302E2E;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:600">7</span>
<span style="width:48px;height:36px;border:1px solid #302E2E;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:600;color:#A19C94;text-decoration:line-through;opacity:.55">8</span>
<span style="width:48px;height:36px;border:1px solid #C9B79A;border-radius:10px;background:#C9B79A;color:#131212;display:grid;place-items:center;font-size:14px;font-weight:700">9</span>
<span style="width:48px;height:36px;border:1px solid #302E2E;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:600">10</span>
<span style="width:48px;height:36px;border:1px solid #302E2E;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:600">11</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A19C94">Brand</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Nike</span>
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Puma</span>
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Off White</span>
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Calvin Klein</span>
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Comfort Trends</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A19C94">Price</span><span style="font-size:14px;font-weight:700;font-variant-numeric:tabular-nums">₹1,000 – ₹13,000</span></div>
<div style="position:relative;height:28px;margin:0 6px">
<div style="position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:#302E2E"></div>
<div style="position:absolute;left:18px;width:215px;top:12px;height:4px;border-radius:2px;background:#C9B79A"></div>
<div style="position:absolute;left:6px;top:2px;width:24px;height:24px;border-radius:50%;background:#131212;border:3px solid #C9B79A;box-sizing:border-box"></div>
<div style="position:absolute;left:221px;top:2px;width:24px;height:24px;border-radius:50%;background:#131212;border:3px solid #C9B79A;box-sizing:border-box"></div>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A19C94">Color</span>
<div style="display:flex;gap:12px">
<span style="width:36px;height:36px;border-radius:50%;border:1px solid #4A4745;background:#131212" role="img" aria-label="Black"></span>
<span style="width:36px;height:36px;border-radius:50%;border:1px solid #4A4745;background:#F2F0EC" role="img" aria-label="White"></span>
<span style="width:36px;height:36px;border-radius:50%;border:1px solid #4A4745;background:#D2573F" role="img" aria-label="Red"></span>
<span style="width:36px;height:36px;border-radius:50%;border:1px solid #4A4745;background:#9BB3BE" role="img" aria-label="Mist blue"></span>
<span style="width:36px;height:36px;border-radius:50%;border:1px solid #4A4745;background:#A5967C" role="img" aria-label="Tan"></span>
<span style="width:36px;height:36px;border-radius:50%;border:1px solid #4A4745;background:#68513F" role="img" aria-label="Brown"></span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A19C94">Foot width</span>
<div style="display:flex;background:#262524;border-radius:10px;padding:3px;gap:2px">
<span style="flex:1;height:34px;border-radius:8px;background:#131212;font-size:13px;font-weight:700;display:grid;place-items:center">Any</span>
<span style="flex:1;height:34px;color:#A19C94;font-size:13px;font-weight:600;display:grid;place-items:center">Narrow</span>
<span style="flex:1;height:34px;color:#A19C94;font-size:13px;font-weight:600;display:grid;place-items:center">Regular</span>
<span style="flex:1;height:34px;color:#A19C94;font-size:13px;font-weight:600;display:grid;place-items:center">Wide</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A19C94">Activity</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Running</span>
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Walking</span>
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Training</span>
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Casual</span>
<span style="height:36px;padding:0 16px;border:1px solid #302E2E;border-radius:18px;display:grid;place-items:center;font-size:13.5px;font-weight:600">Formal</span>
</div>
</div>

</div>

<div style="display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid #302E2E;background:#1A1918">
<div style="flex:1;height:48px;border:1.5px solid #F2F0EC;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:600;box-sizing:border-box">Clear</div>
<div style="flex:2;height:48px;border-radius:12px;background:#C9B79A;color:#131212;display:grid;place-items:center;font-size:15px;font-weight:700">Show 18 shoes</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
