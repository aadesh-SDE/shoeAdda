<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saved addresses, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:14px;padding-top:12px">

<div style="display:flex;align-items:center;height:52px;padding:0 4px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<span style="width:44px;height:44px;display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-back"/></svg></span>
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.015em;text-transform:uppercase">Saved addresses</h1>
</div>

<div style="display:flex;flex-direction:column;gap:12px;padding:0 16px">
<sc-for list="{{addrs}}" as="a" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:10px;padding:14px;border:{{a.border}};border-radius:16px">
<div style="display:flex;align-items:center;gap:8px"><span style="font-size:15px;font-weight:700">Amit Kulkarni</span><span style="height:22px;padding:0 8px;border-radius:11px;background:#1F1E1E;font-size:11.5px;font-weight:700;display:grid;place-items:center">{{a.type}}</span><span style="font-size:11.5px;font-weight:700;color:#C9B79A">{{a.def}}</span></div>
<span style="font-size:13.5px;line-height:1.5">{{a.text}}</span>
<span style="font-size:13.5px;color:#A19C94;font-variant-numeric:tabular-nums">+91 98765 43210</span>
<div style="display:flex;gap:16px;padding-top:10px;border-top:1px solid #302E2E">
<span style="display:grid;place-items:center;min-height:36px;font-size:13.5px;font-weight:700;color:#C9B79A">Edit</span>
<span style="display:grid;place-items:center;min-height:36px;font-size:13.5px;font-weight:700;color:#E58A72">Delete</span>
<span style="display:grid;place-items:center;min-height:36px;font-size:13.5px;font-weight:600;margin-left:auto">{{a.setdef}}</span>
</div>
</div>
</sc-for>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#131212;border-top:1px solid #302E2E;padding:12px 16px 20px;box-sizing:border-box">
<div style="width:100%;height:52px;border:1.5px solid #F2F0EC;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;box-sizing:border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-plus"/></svg>Add new address</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      addrs: [
        { type: 'Home', def: 'Default', border: '1.5px solid #C9B79A', setdef: '', text: 'Flat 402, Sunrise Apartments, Baner Road, Pune, Maharashtra 411045' },
        { type: 'Work', def: '', border: '1px solid #302E2E', setdef: 'Set as default', text: 'Office 7B, Techpark One, Yerawada, Pune, Maharashtra 411006' }
      ]
    };
  }
}
</script>
</body>
</html>
