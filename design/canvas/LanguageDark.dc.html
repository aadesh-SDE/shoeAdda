<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Language, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Gujarati:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Telugu:wght@500;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo','Noto Sans Devanagari','Noto Sans Gujarati','Noto Sans Tamil','Noto Sans Telugu',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:16px;padding-top:12px">

<div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.015em;text-transform:uppercase">Select language</h1>
<svg width="30" height="30" viewBox="0 0 120 120" role="img" aria-label="ShoeAdda"><rect width="120" height="120" rx="28" fill="#C9B79A"/><g transform="translate(13 28) scale(1.12)"><path d="M8 50c0-6 6-8 12-10l16-17c4-4 10-2 14 2l8 8c8 2 26 4 34 10 4 3 4 8 0 10H12z" fill="#131212"/><path d="M8 50h84v6c0 2-2 3-4 3H12c-2 0-4-1-4-3z" fill="#68513F"/><path d="M38 24l7 8M46 26l7 8" stroke="#C9B79A" stroke-width="2.4" stroke-linecap="round"/></g></svg>
</div>

<div style="display:flex;flex-direction:column;gap:6px;padding:0 16px">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em">Choose your language</span>
<span style="font-size:14px;color:#A19C94">You can change this later in Profile.</span>
</div>

<div style="display:flex;flex-direction:column;gap:10px;padding:0 16px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="6">
<div lang="{{l.code}}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;padding:0 16px;border:{{l.border}};border-radius:16px">
<div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:20px;font-weight:700;line-height:1.3">{{l.native}}</span><span style="font-size:13px;color:#A19C94">{{l.english}}</span></div>
<span style="flex:none;width:24px;height:24px;border-radius:50%;border:{{l.ring}};background:{{l.fill}};display:grid;place-items:center;color:#131212;box-sizing:border-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{l.tick}}" aria-hidden="true"><use href="#i-check"/></svg></span>
</div>
</sc-for>
</div>

</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#131212;border-top:1px solid #302E2E;padding:12px 16px 20px;box-sizing:border-box">
<div style="display:grid;place-items:center;width:100%;height:52px;border-radius:12px;background:#C9B79A;color:#131212;font-size:15px;font-weight:700">Continue</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { border: '1.5px solid #C9B79A', ring: '2px solid #C9B79A', fill: '#C9B79A', tick: 1 };
    const off = { border: '1px solid #302E2E', ring: '2px solid #302E2E', fill: 'transparent', tick: 0 };
    return {
      langs: [
        { code: 'en', native: 'English', english: 'English', ...on },
        { code: 'hi', native: 'हिन्दी', english: 'Hindi', ...off },
        { code: 'mr', native: 'मराठी', english: 'Marathi', ...off },
        { code: 'gu', native: 'ગુજરાતી', english: 'Gujarati', ...off },
        { code: 'ta', native: 'தமிழ்', english: 'Tamil', ...off },
        { code: 'te', native: 'తెలుగు', english: 'Telugu', ...off }
      ]
    };
  }
}
</script>
</body>
</html>
