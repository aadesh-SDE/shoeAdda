<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No results, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
input{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:24px;padding-top:12px">

<div style="display:flex;align-items:center;gap:4px;height:56px;padding:0 16px 0 4px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<span style="flex:none;width:44px;height:44px;display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-back"/></svg></span>
<div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:12px;background:#1F1E1E;box-sizing:border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A19C94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-search"/></svg>
<label for="q2" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search shoes</label>
<input id="q2" type="text" value="xyzshoe" style="flex:1;min-width:0;border:0;background:transparent;color:#F2F0EC;font-size:15px;font-weight:500;outline:none;padding:0">
<span style="flex:none;width:32px;height:32px;color:#A19C94;display:grid;place-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-close"/></svg></span>
</div>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 32px 0;text-align:center">
<div style="position:relative;width:160px;height:160px">
<div style="position:absolute;inset:0;border-radius:50%;background:#2B3A41"></div>
<svg viewBox="0 0 24 24" style="position:absolute;left:34px;top:34px;width:92px;height:92px" role="img" aria-label="No results"><circle cx="11" cy="11" r="6.5" fill="#F2F0EC" stroke="#C9B79A" stroke-width="1.6"/><path d="M20 20l-4.2-4.2" stroke="#C9B79A" stroke-width="1.8" stroke-linecap="round"/><path d="M9 9l4 4M13 9l-4 4" stroke="#131212" stroke-width="1.4" stroke-linecap="round"/></svg>
</div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center">
<h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;line-height:1.05;letter-spacing:.015em;text-transform:uppercase">No results for "xyzshoe"</h2>
<p style="margin:0;font-size:14.5px;line-height:1.5;color:#A19C94;max-width:280px">Check the spelling, try a shorter word, or search by brand.</p>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px;padding:0 16px">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase">Popular categories</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<span style="height:40px;padding:0 18px;border-radius:20px;background:#1F1E1E;display:grid;place-items:center;font-size:14px;font-weight:600">{{c}}</span>
</sc-for>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { chips: ['Sneakers', 'Sports', 'Casual', 'Formal', 'Nike', 'Puma'] };
  }
}
</script>
</body>
</html>
