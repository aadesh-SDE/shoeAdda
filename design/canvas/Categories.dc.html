<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FBFBFB;color:#131212;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.4A4 4 0 0119 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 11h10.6L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:16px;padding-top:12px">

<div style="display:flex;align-items:center;height:52px;padding:0 16px;border-bottom:1px solid #D4D5D2;box-sizing:border-box">
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.015em;text-transform:uppercase">Categories</h1>
</div>

<div style="padding:0 16px">
<button style="width:100%;height:46px;border:0;border-radius:12px;background:#EEEEEC;color:#6B6B66;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;cursor:pointer;text-align:left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-search"/></svg>Search shoes, brands</button>
</div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<a href="ProductList.dc.html" style="position:relative;height:104px;border-radius:16px;background:{{c.bg}};overflow:hidden;display:block;text-decoration:none">
<svg viewBox="0 0 100 62" style="position:absolute;right:-8px;bottom:-4px;width:112px;height:auto" aria-hidden="true"><path d="M6 48c0-6 6-8 12-10l16-17c4-4 10-2 14 2l8 8c8 2 28 4 36 10 4 3 4 8 0 10H10z" fill="{{c.body}}"/><path d="M6 48h88v7c0 2-2 3-4 3H10c-2 0-4-1-4-3z" fill="#131212"/></svg>
<span style="position:absolute;left:10px;top:10px;height:28px;padding:0 12px;border-radius:14px;background:#FBFBFB;color:#131212;font-size:13.5px;font-weight:700;display:grid;place-items:center">{{c.name}}</span>
</a>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;padding:0 16px">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:4px">Brands</span>
<sc-for list="{{brands}}" as="b" hint-placeholder-count="3">
<a href="ProductList.dc.html" style="display:flex;align-items:center;gap:12px;height:52px;border-bottom:1px solid #D4D5D2;color:#131212;text-decoration:none"><span style="flex:1;font-size:15px;font-weight:600">{{b.name}}</span><span style="font-size:13px;color:#6B6B66">{{b.count}}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chev"/></svg></a>
</sc-for>
</div>

</div>

<nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:72px;background:#FBFBFB;border-top:1px solid #D4D5D2;display:flex;box-sizing:border-box">
<a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B6B66;text-decoration:none;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-home"/></svg>Home</a>
<a href="#categories" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#68513F;text-decoration:none;font-size:11px;font-weight:700;position:relative"><span style="position:absolute;top:-1px;width:28px;height:3px;border-radius:2px;background:#68513F"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-grid"/></svg>Categories</a>
<a href="Wishlist.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B6B66;text-decoration:none;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"/></svg>Wishlist</a>
<a href="Cart.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B6B66;text-decoration:none;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-cart"/></svg>Cart</a>
<a href="Profile.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B6B66;text-decoration:none;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-user"/></svg>Profile</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cats: [
        { name: 'Men', bg: '#9BB3BE', body: '#8C2F23' },
        { name: 'Women', bg: '#A5967C', body: '#FBFBFB' },
        { name: 'Kids', bg: '#D4D5D2', body: '#B4472F' },
        { name: 'Sports', bg: '#68513F', body: '#FBFBFB' },
        { name: 'Casual', bg: '#9BB3BE', body: '#FBFBFB' },
        { name: 'Formal', bg: '#D4D5D2', body: '#131212' }
      ],
      brands: [
        { name: 'Nike', count: '12 shoes' },
        { name: 'Puma', count: '9 shoes' },
        { name: 'Off White', count: '6 shoes' },
        { name: 'Calvin Klein', count: '5 shoes' },
        { name: 'Comfort Trends', count: '4 shoes' }
      ]
    };
  }
}
</script>
</body>
</html>
