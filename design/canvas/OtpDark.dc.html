<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OTP, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:20px;padding:12px 16px 0">

<div style="display:flex;align-items:center;height:52px;margin:0 -16px;padding:0 4px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<span style="width:44px;height:44px;display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-back"/></svg></span>
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.015em;text-transform:uppercase">Verify phone</h1>
</div>

<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
<h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em">Enter the 6-digit code</h2>
<p style="margin:0;font-size:14.5px;color:#A19C94">Sent to <b style="color:#F2F0EC;font-variant-numeric:tabular-nums">+91 98765 43210</b> <span style="margin-left:6px;font-weight:600;color:#C9B79A">Change</span></p>
</div>

<div style="display:flex;gap:8px" role="group" aria-label="One-time code">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
<span style="flex:1;height:60px;border:1.5px solid #F2F0EC;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:700">{{d}}</span>
</sc-for>
</div>

<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:12px;background:#1F1E1E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9B79A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px" aria-hidden="true"><use href="#i-info"/></svg>
<span style="font-size:13.5px;line-height:1.5">Demo mode: no text message is sent. Use the code <b style="font-variant-numeric:tabular-nums">123456</b>.</span>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;font-size:14px">
<span style="color:#A19C94">Didn't get a code?</span>
<span style="font-weight:600;font-variant-numeric:tabular-nums">Resend in 00:24</span>
</div>

</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#131212;border-top:1px solid #302E2E;padding:12px 16px 20px;box-sizing:border-box">
<div style="display:grid;place-items:center;width:100%;height:52px;border-radius:12px;background:#C9B79A;color:#131212;font-size:15px;font-weight:700">Verify and continue</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { digits: ['1', '2', '3', '4', '5', '6'] };
  }
}
</script>
</body>
</html>
