<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sort sheet, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">

<div style="padding:24px 16px;display:flex;flex-direction:column;gap:16px" aria-hidden="true">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.015em">Men's sneakers</span>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="height:150px;border-radius:16px;background:#2B3A41"></div><div style="height:150px;border-radius:16px;background:#2A2A2A"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="height:150px;border-radius:16px;background:#3E382F"></div><div style="height:150px;border-radius:16px;background:#2B3A41"></div></div>
</div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,.62)"></div>

<div role="dialog" aria-label="Sort by" style="position:absolute;left:0;right:0;bottom:0;background:#1A1918;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:20px">
<div style="width:40px;height:4px;border-radius:2px;background:#302E2E;margin:10px auto 4px"></div>
<div style="display:flex;align-items:center;height:48px;padding:0 16px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.015em;text-transform:uppercase">Sort by</h2>
</div>
<div style="display:flex;flex-direction:column;padding:4px 16px 0">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
<div style="display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid #302E2E">
<span style="font-size:15px;font-weight:{{o.weight}}">{{o.name}}</span>
<span style="width:22px;height:22px;border-radius:50%;border:2px solid {{o.ring}};box-sizing:border-box;display:grid;place-items:center"><span style="width:10px;height:10px;border-radius:50%;background:{{o.dot}}"></span></span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { weight: 700, ring: '#C9B79A', dot: '#C9B79A' };
    const off = { weight: 500, ring: '#A19C94', dot: 'transparent' };
    return {
      opts: [
        { name: 'Popularity', ...on },
        { name: 'Price: low to high', ...off },
        { name: 'Price: high to low', ...off },
        { name: 'Newest first', ...off },
        { name: 'Biggest discount', ...off }
      ]
    };
  }
}
</script>
</body>
</html>
