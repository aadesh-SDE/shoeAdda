<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wishlist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FBFBFB;color:#131212;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.4A4 4 0 0119 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 21h4"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 11h10.6L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:14px;padding-top:12px">

<div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid #D4D5D2;box-sizing:border-box">
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.015em;text-transform:uppercase">Wishlist</h1>
<span style="font-size:13px;color:#6B6B66">4 saved</span>
</div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding:0 16px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:8px;min-width:0">
<div style="position:relative;height:140px;border-radius:16px;background:{{p.bg}};display:grid;place-items:center;overflow:hidden">
<button aria-label="Remove from wishlist" style="position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer"><span style="width:30px;height:30px;border-radius:50%;background:#FBFBFB;color:#68513F;display:grid;place-items:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"/></svg></span></button>
<svg viewBox="0 0 100 62" style="width:80%;height:auto;opacity:{{p.fade}}" aria-hidden="true"><path d="M6 48c0-6 6-8 12-10l16-17c4-4 10-2 14 2l8 8c8 2 28 4 36 10 4 3 4 8 0 10H10z" fill="{{p.body}}"/><path d="M30 43c14-6 34-6 52 0" fill="none" stroke="{{p.stripe}}" stroke-width="3" stroke-linecap="round"/><path d="M6 48h88v7c0 2-2 3-4 3H10c-2 0-4-1-4-3z" fill="{{p.sole}}"/><path d="M36 22l7 8M44 24l7 8" stroke="{{p.stripe}}" stroke-width="2.2" stroke-linecap="round"/></svg>
</div>
<div style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">{{p.brand}}</span>
<span style="font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.name}}</span>
<span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px">{{p.price}}</span>
</div>
<button style="height:40px;border:{{p.btnBorder}};border-radius:10px;background:{{p.btnBg}};color:{{p.btnFg}};font-size:13.5px;font-weight:700;cursor:pointer">{{p.btn}}</button>
</div>
</sc-for>
</div>

</div>

<nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:72px;background:#FBFBFB;border-top:1px solid #D4D5D2;display:flex;box-sizing:border-box">
<a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B6B66;text-decoration:none;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-home"/></svg>Home</a>
<a href="Categories.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B6B66;text-decoration:none;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-grid"/></svg>Categories</a>
<a href="#wishlist" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#68513F;text-decoration:none;font-size:11px;font-weight:700;position:relative"><span style="position:absolute;top:-1px;width:28px;height:3px;border-radius:2px;background:#68513F"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"/></svg>Wishlist</a>
<a href="Cart.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B6B66;text-decoration:none;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-cart"/></svg>Cart</a>
<a href="Profile.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B6B66;text-decoration:none;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-user"/></svg>Profile</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cart = { btn: 'Move to cart', btnBorder: '0', btnBg: '#68513F', btnFg: '#FFFFFF', fade: 1 };
    const notify = { btn: 'Notify me', btnBorder: '1.5px solid #131212', btnBg: 'transparent', btnFg: '#131212', fade: 0.45 };
    return {
      items: [
        { name: 'Air Jordan 1 Red and Black', brand: 'Nike', price: '₹12,499', bg: '#9BB3BE', body: '#8C2F23', sole: '#131212', stripe: '#131212', ...cart },
        { name: 'Puma Future Rider Trainers', brand: 'Puma', price: '₹7,599', bg: '#A5967C', body: '#FBFBFB', sole: '#131212', stripe: '#68513F', ...cart },
        { name: 'Sports Sneakers Off White & Red', brand: 'Off White', price: '₹9,999', bg: '#9BB3BE', body: '#FBFBFB', sole: '#B4472F', stripe: '#131212', ...notify },
        { name: 'Nike Baseball Cleats', brand: 'Nike', price: '₹6,799', bg: '#D4D5D2', body: '#131212', sole: '#FBFBFB', stripe: '#9BB3BE', ...cart }
      ]
    };
  }
}
</script>
</body>
</html>
