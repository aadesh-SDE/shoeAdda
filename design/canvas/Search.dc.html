<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FBFBFB;color:#131212;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:12px;padding-top:12px">

<div style="display:flex;align-items:center;gap:4px;height:56px;padding:0 16px 0 4px;border-bottom:1px solid #D4D5D2;box-sizing:border-box">
<a href="Main.dc.html" aria-label="Back" style="flex:none;width:44px;height:44px;color:#131212;display:grid;place-items:center;text-decoration:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-back"/></svg></a>
<div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:12px;background:#EEEEEC;box-sizing:border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-search"/></svg>
<label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search shoes</label>
<input id="q" type="text" value="air jor" style="flex:1;min-width:0;border:0;background:transparent;color:#131212;font-size:15px;font-weight:500;outline:none;padding:0">
<button aria-label="Clear search" style="flex:none;width:32px;height:32px;border:0;background:transparent;color:#6B6B66;display:grid;place-items:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-close"/></svg></button>
</div>
</div>

<div style="display:flex;flex-direction:column;padding:0 16px">
<sc-for list="{{sugg}}" as="s" hint-placeholder-count="5">
<a href="ProductList.dc.html" style="display:flex;align-items:center;gap:12px;height:54px;border-bottom:1px solid #D4D5D2;color:#131212;text-decoration:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-search"/></svg>
<span style="flex:1;font-size:15px;min-width:0"><b style="font-weight:700">{{s.match}}</b>{{s.rest}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-arrow"/></svg>
</a>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;gap:10px;padding:8px 16px 0">
<div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase">Recent searches</span><a href="#clear" style="font-size:13px;font-weight:600;color:#68513F;text-decoration:none">Clear</a></div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="height:36px;padding:0 14px;border-radius:18px;background:#EEEEEC;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><use href="#i-clock"/></svg>puma trainers</span>
<span style="height:36px;padding:0 14px;border-radius:18px;background:#EEEEEC;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><use href="#i-clock"/></svg>running shoes UK 9</span>
<span style="height:36px;padding:0 14px;border-radius:18px;background:#EEEEEC;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><use href="#i-clock"/></svg>off white</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px;padding:8px 16px 0">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase">Trending now</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="height:36px;padding:0 14px;border-radius:18px;border:1px solid #D4D5D2;display:grid;place-items:center;font-size:13.5px;font-weight:600">sneakers</span>
<span style="height:36px;padding:0 14px;border-radius:18px;border:1px solid #D4D5D2;display:grid;place-items:center;font-size:13.5px;font-weight:600">nike baseball cleats</span>
<span style="height:36px;padding:0 14px;border-radius:18px;border:1px solid #D4D5D2;display:grid;place-items:center;font-size:13.5px;font-weight:600">white sneakers</span>
<span style="height:36px;padding:0 14px;border-radius:18px;border:1px solid #D4D5D2;display:grid;place-items:center;font-size:13.5px;font-weight:600">slippers</span>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sugg: [
        { match: 'air jor', rest: 'dan 1' },
        { match: 'air jor', rest: 'dan 1 red and black' },
        { match: 'air jor', rest: 'dan men' },
        { match: 'air jor', rest: 'dan size 9' },
        { match: 'air jor', rest: 'dan under ₹13,000' }
      ]
    };
  }
}
</script>
</body>
</html>
