<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coupon sheet, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
input{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
</defs></svg>

<div style="padding:24px 16px;display:flex;flex-direction:column;gap:12px" aria-hidden="true">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.015em">Cart</span>
<div style="height:120px;border-radius:16px;border:1px solid #302E2E"></div>
<div style="height:120px;border-radius:16px;border:1px solid #302E2E"></div>
</div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,.62)"></div>

<div role="dialog" aria-label="Apply coupon" style="position:absolute;left:0;right:0;bottom:0;top:120px;background:#1A1918;border-radius:24px 24px 0 0;display:flex;flex-direction:column">
<div style="width:40px;height:4px;border-radius:2px;background:#302E2E;margin:10px auto 4px"></div>
<div style="display:flex;align-items:center;height:48px;padding:0 16px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.015em;text-transform:uppercase">Apply coupon</h2>
</div>

<div style="display:flex;flex-direction:column;gap:16px;padding:16px">
<div style="display:flex;gap:8px">
<label for="code" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Coupon code</label>
<input id="code" type="text" placeholder="Enter coupon code" style="flex:1;min-width:0;height:48px;border:1.5px solid #F2F0EC;border-radius:12px;background:#131212;color:#F2F0EC;font-size:15px;font-weight:600;padding:0 14px;box-sizing:border-box;text-transform:uppercase">
<span style="flex:none;height:48px;padding:0 20px;border-radius:12px;background:#C9B79A;color:#131212;font-size:14px;font-weight:700;display:grid;place-items:center">Apply</span>
</div>

<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{coupons}}" as="c" hint-placeholder-count="3">
<div style="display:flex;gap:12px;align-items:center;padding:14px;border:{{c.border}};border-radius:16px">
<span style="flex:none;width:44px;height:44px;border-radius:12px;background:#262524;color:#C9B79A;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-tag"/></svg></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700;letter-spacing:.04em">{{c.code}}</span><span style="font-size:13px">{{c.title}}</span><span style="font-size:12px;color:#A19C94">{{c.rule}}</span></div>
<span style="flex:none;height:40px;padding:0 16px;border:{{c.btnBorder}};border-radius:10px;background:{{c.btnBg}};color:{{c.btnFg}};font-size:13.5px;font-weight:700;display:grid;place-items:center;box-sizing:border-box">{{c.btn}}</span>
</div>
</sc-for>
</div>

<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#C9B79A;font-weight:600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-check"/></svg>WELCOME10 applied. You save ₹2,010.</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const applied = { border: '1.5px solid #C9B79A', btn: 'Remove', btnBorder: '1.5px solid #F2F0EC', btnBg: 'transparent', btnFg: '#F2F0EC' };
    const free = { border: '1px solid #302E2E', btn: 'Apply', btnBorder: '0', btnBg: '#C9B79A', btnFg: '#131212' };
    return {
      coupons: [
        { code: 'WELCOME10', title: '10% off your first order', rule: 'No minimum order', ...applied },
        { code: 'SHOE200', title: '₹200 off', rule: 'On orders above ₹1,999', ...free },
        { code: 'FREESHIP', title: 'Free delivery', rule: 'On any order', ...free }
      ]
    };
  }
}
</script>
</body>
</html>
