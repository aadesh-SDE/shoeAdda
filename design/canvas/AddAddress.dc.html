<!doctype html>
<html lang="en">

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FBFBFB;color:#131212;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:14px;padding-top:12px">

<div style="display:flex;align-items:center;height:52px;padding:0 4px;border-bottom:1px solid #D4D5D2;box-sizing:border-box">
<a href="Checkout.dc.html" aria-label="Back" style="width:44px;height:44px;color:#131212;display:grid;place-items:center;text-decoration:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-back"/></svg></a>
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.015em;text-transform:uppercase">Add address</h1>
</div>

<div style="display:flex;flex-direction:column;gap:12px;padding:0 16px">

<div style="display:flex;flex-direction:column;gap:5px"><label for="a-name" style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">Full name</label><input id="a-name" type="text" value="Amit Kulkarni" style="height:48px;border:1px solid #D4D5D2;border-radius:12px;background:#FBFBFB;color:#131212;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%"></div>
<div style="display:flex;flex-direction:column;gap:5px"><label for="a-phone" style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">Phone number</label><input id="a-phone" type="tel" value="+91 98765 43210" style="height:48px;border:1px solid #D4D5D2;border-radius:12px;background:#FBFBFB;color:#131212;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%"></div>
<div style="display:flex;gap:10px">
<div style="flex:1;display:flex;flex-direction:column;gap:5px"><label for="a-pin" style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">Pincode</label><input id="a-pin" type="text" inputmode="numeric" value="411045" style="height:48px;border:1.5px solid #131212;border-radius:12px;background:#FBFBFB;color:#131212;font-size:15px;font-weight:600;padding:0 14px;box-sizing:border-box;width:100%"></div>
<div style="flex:1;display:flex;flex-direction:column;gap:5px"><label for="a-city" style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">City</label><input id="a-city" type="text" value="Pune" style="height:48px;border:1px solid #D4D5D2;border-radius:12px;background:#EEEEEC;color:#131212;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%"></div>
</div>
<div style="display:flex;flex-direction:column;gap:5px"><label for="a-state" style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">State</label><input id="a-state" type="text" value="Maharashtra" style="height:48px;border:1px solid #D4D5D2;border-radius:12px;background:#EEEEEC;color:#131212;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%"></div>
<div style="display:flex;flex-direction:column;gap:5px"><label for="a-house" style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">Flat, house no., building</label><input id="a-house" type="text" value="Flat 402, Sunrise Apartments" style="height:48px;border:1px solid #D4D5D2;border-radius:12px;background:#FBFBFB;color:#131212;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%"></div>
<div style="display:flex;flex-direction:column;gap:5px"><label for="a-area" style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">Area, street</label><input id="a-area" type="text" value="Baner Road" style="height:48px;border:1px solid #D4D5D2;border-radius:12px;background:#FBFBFB;color:#131212;font-size:15px;padding:0 14px;box-sizing:border-box;width:100%"></div>

<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6B66">Address type</span>
<div style="display:flex;gap:8px">
<button style="height:40px;padding:0 20px;border:1px solid #68513F;border-radius:20px;background:#68513F;color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer" aria-pressed="true">Home</button>
<button style="height:40px;padding:0 20px;border:1px solid #D4D5D2;border-radius:20px;background:#FBFBFB;color:#131212;font-size:14px;font-weight:600;cursor:pointer">Work</button>
<button style="height:40px;padding:0 20px;border:1px solid #D4D5D2;border-radius:20px;background:#FBFBFB;color:#131212;font-size:14px;font-weight:600;cursor:pointer">Other</button>
</div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;height:44px"><span style="font-size:15px;font-weight:600">Make this my default address</span>
<button role="switch" aria-checked="true" aria-label="Default address" style="position:relative;width:48px;height:28px;border:0;border-radius:14px;background:#68513F;cursor:pointer;padding:0"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#FBFBFB;box-shadow:0 1px 2px rgba(0,0,0,.25)"></span></button></div>

</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#FBFBFB;border-top:1px solid #D4D5D2;padding:12px 16px 20px;box-sizing:border-box">
<a href="Checkout.dc.html" style="display:grid;place-items:center;width:100%;height:52px;border-radius:12px;background:#68513F;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none">Save address</a>
</div>
</div>
</x-dc>

</body>
</html>
