<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#131212;color:#F2F0EC;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 11h10.6L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.4A4 4 0 0119 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
<symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></symbol>
</defs></svg>

<div style="display:flex;flex-direction:column;gap:14px;padding:12px 16px 0">

<div style="display:flex;align-items:center;gap:10px;height:52px;margin:0 -16px;padding:0 16px;border-bottom:1px solid #302E2E;box-sizing:border-box">
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;line-height:1;letter-spacing:.015em;text-transform:uppercase">Cart</h1>
<span style="font-size:13px;color:#A19C94">2 items</span>
</div>

<sc-for list="{{items}}" as="p" hint-placeholder-count="2">
<div style="display:flex;gap:12px;padding:12px;border:1px solid #302E2E;border-radius:16px">
<div style="flex:none;width:88px;height:88px;border-radius:12px;background:{{p.bg}};display:grid;place-items:center">
<svg viewBox="0 0 100 62" style="width:80%;height:auto" aria-hidden="true"><path d="M6 48c0-6 6-8 12-10l16-17c4-4 10-2 14 2l8 8c8 2 28 4 36 10 4 3 4 8 0 10H10z" fill="{{p.body}}"/><path d="M30 43c14-6 34-6 52 0" fill="none" stroke="{{p.stripe}}" stroke-width="3" stroke-linecap="round"/><path d="M6 48h88v7c0 2-2 3-4 3H10c-2 0-4-1-4-3z" fill="{{p.sole}}"/><path d="M36 22l7 8M44 24l7 8" stroke="{{p.stripe}}" stroke-width="2.2" stroke-linecap="round"/></svg>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:4px">
<div style="min-width:0;display:flex;flex-direction:column"><span style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A19C94">{{p.brand}}</span><span style="font-size:14px;font-weight:600;line-height:1.3">{{p.name}}</span></div>
<span style="flex:none;width:44px;height:44px;margin:-12px -12px 0 0;color:#A19C94;display:grid;place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-trash"/></svg></span>
</div>
<span style="font-size:13px;color:#A19C94">Size: <b style="color:#F2F0EC">UK 9</b></span>
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:2px">
<span style="font-size:16px;font-weight:700;font-variant-numeric:tabular-nums">{{p.price}}</span>
<div style="display:flex;align-items:center;height:36px;border:1px solid #302E2E;border-radius:10px">
<span style="width:36px;height:36px;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-minus"/></svg></span>
<span style="min-width:22px;text-align:center;font-size:14px;font-weight:700">1</span>
<span style="width:36px;height:36px;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-plus"/></svg></span>
</div>
</div>
<span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#C9B79A;min-height:28px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"/></svg>Move to wishlist</span>
</div>
</div>
</sc-for>

<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#1F1E1E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9B79A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-tag"/></svg>
<div style="flex:1;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:700">WELCOME10 applied</span><span style="font-size:12.5px;color:#A19C94">You save ₹2,010</span></div>
<span style="font-size:13px;font-weight:600;color:#C9B79A">Change</span>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A19C94">Price details</span>
<div style="display:flex;justify-content:space-between;font-size:14px"><span>Subtotal (2 items)</span><span style="font-variant-numeric:tabular-nums">₹20,098</span></div>
<div style="display:flex;justify-content:space-between;font-size:14px"><span>Coupon WELCOME10</span><span style="font-variant-numeric:tabular-nums;color:#C9B79A;font-weight:600">−₹2,010</span></div>
<div style="display:flex;justify-content:space-between;font-size:14px"><span>Delivery</span><span style="font-weight:600;color:#C9B79A">Free</span></div>
</div>

</div>

<div style="position:absolute;left:0;right:0;bottom:72px;height:76px;background:#131212;border-top:1px solid #302E2E;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;box-sizing:border-box">
<div style="display:flex;flex-direction:column"><span style="font-size:12px;color:#A19C94">Total</span><span style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">₹18,088</span></div>
<div style="width:190px;height:52px;border-radius:12px;background:#C9B79A;color:#131212;font-size:15px;font-weight:700;display:grid;place-items:center">Checkout</div>
</div>

<nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:72px;background:#131212;border-top:1px solid #302E2E;display:flex;box-sizing:border-box">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#A19C94;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-home"/></svg>Home</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#A19C94;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-grid"/></svg>Categories</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#A19C94;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"/></svg>Wishlist</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#C9B79A;font-size:11px;font-weight:700;position:relative"><span style="position:absolute;top:-1px;width:28px;height:3px;border-radius:2px;background:#C9B79A"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-cart"/></svg>Cart</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#A19C94;font-size:11px;font-weight:600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-user"/></svg>Profile</div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Air Jordan 1 Red and Black', brand: 'Nike', price: '₹12,499', bg: '#2B3A41', body: '#D2573F', sole: '#131212', stripe: '#131212' },
        { name: 'Puma Future Rider Trainers', brand: 'Puma', price: '₹7,599', bg: '#3E382F', body: '#F2F0EC', sole: '#131212', stripe: '#C9B79A' }
      ]
    };
  }
}
</script>
</body>
</html>
