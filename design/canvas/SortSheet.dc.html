<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sort sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FBFBFB;color:#131212;font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box">

<div style="padding:24px 16px;display:flex;flex-direction:column;gap:16px" aria-hidden="true">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.015em">Men's sneakers</span>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="height:150px;border-radius:16px;background:#9BB3BE"></div><div style="height:150px;border-radius:16px;background:#D4D5D2"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="height:150px;border-radius:16px;background:#A5967C"></div><div style="height:150px;border-radius:16px;background:#9BB3BE"></div></div>
</div>
<a href="ProductList.dc.html" aria-label="Close sort options" style="position:absolute;inset:0;background:rgba(19,18,18,.55)"></a>

<div role="dialog" aria-label="Sort by" style="position:absolute;left:0;right:0;bottom:0;background:#FBFBFB;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:20px">
<div style="width:40px;height:4px;border-radius:2px;background:#D4D5D2;margin:10px auto 4px"></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-bottom:1px solid #D4D5D2;box-sizing:border-box">
<h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.015em;text-transform:uppercase">Sort by</h2>
</div>
<div style="display:flex;flex-direction:column;padding:4px 16px 0">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
<a href="ProductList.dc.html" style="display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid #D4D5D2;color:#131212;text-decoration:none">
<span style="font-size:15px;font-weight:{{o.weight}}">{{o.name}}</span>
<span style="width:22px;height:22px;border-radius:50%;border:2px solid {{o.ring}};box-sizing:border-box;display:grid;place-items:center"><span style="width:10px;height:10px;border-radius:50%;background:{{o.dot}}"></span></span>
</a>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { weight: 700, ring: '#68513F', dot: '#68513F' };
    const off = { weight: 500, ring: '#6B6B66', dot: 'transparent' };
    return {
      opts: [
        { name: 'Popularity', ...on },
        { name: 'Price: low to high', ...off },
        { name: 'Price: high to low', ...off },
        { name: 'Newest first', ...off },
        { name: 'Biggest discount', ...off }
      ]
    };
  }
}
</script>
</body>
</html>
